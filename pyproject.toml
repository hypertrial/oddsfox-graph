[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oddsfox-graph"
version = "0.6.0"
description = "Build and discover structural logic graph artifacts from Polymarket data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Hypertrial"}]
dependencies = ["duckdb>=1.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/hypertrial/oddsfox-graph"
DataPipeline = "https://github.com/hypertrial/oddsfox-pipeline"

[project.optional-dependencies]
discovery = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2",
  "python-sat==1.9.dev7",
  "sentence-transformers>=5",
]
dev = [
  "build>=1",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2",
  "python-sat==1.9.dev7",
  "pytest>=8",
  "ruff>=0.11",
  "mypy>=1.15",
]

[tool.mypy]
python_version = "3.11"
files = [
  "oddsfox_graph/_discovery/contracts.py",
  "oddsfox_graph/_discovery/evaluation_metrics.py",
  "oddsfox_graph/_discovery/incremental.py",
  "oddsfox_graph/_discovery/inference.py",
  "oddsfox_graph/_discovery/nli.py",
  "oddsfox_graph/_discovery/publication.py",
  "oddsfox_graph/_discovery/types.py",
  "oddsfox_graph/_discovery/versions.py",
  "oddsfox_graph/_discovery/workspace.py",
  "oddsfox_graph/model_tools.py",
  "oddsfox_graph/queries.py",
]
strict = true

[[tool.mypy.overrides]]
module = [
  "oddsfox_graph.discovery",
  "oddsfox_graph._discovery.input",
]
follow_imports = "skip"

[project.scripts]
oddsfox-graph = "oddsfox_graph.cli:main"

[tool.setuptools.packages.find]
include = ["oddsfox_graph*"]

[tool.setuptools.package-data]
oddsfox_graph = ["benchmarks/*.md", "benchmarks/*.parquet", "taxonomies/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "full_output: checks that require existing output/wc2026 artifacts",
]
