[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oddsgraph"
version = "0.1.0"
description = "Local Logical Knowledge Graph Compiler for Polymarket WC2026."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Hypertrial"}]
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyarrow>=18",
    "llama-cpp-python>=0.3",
    "pydantic>=2.10",
    "rapidfuzz>=3.10",
    "rustworkx>=0.15",
    "typer>=0.15",
    "outlines>=1.3.3",
    "numba>=0.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0", "ruff>=0.15"]
docs = ["mkdocs>=1.6.0", "mkdocs-material>=9.5.0"]
explore = ["dash>=2.18", "dash-cytoscape>=1.0"]
mlx = ["mlx-lm>=0.22", "outlines>=1.0"]

[project.scripts]
oddsgraph = "oddsgraph.cli:app"

[project.urls]
Repository = "https://github.com/hypertrial/oddsfox-graph"

[tool.setuptools.packages.find]
include = ["oddsgraph*"]

[tool.setuptools.package-data]
oddsgraph = ["data/*.json", "explorer/assets/*", "explorer/assets/flags/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Avoid prepend-import mode: putting ``tests/`` on sys.path breaks
# ``from tests.helpers import …`` (looks for tests/tests/helpers).
addopts = ["--import-mode=importlib"]
markers = [
    "integration: live model integration tests",
]

[tool.ruff]
target-version = "py311"
src = ["oddsgraph", "tests", "scripts"]

# Pin the classic default ruleset (pycodestyle errors + pyflakes). Ruff 0.16+
# expanded its implicit defaults; keep CI stable and match the verified scope.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
