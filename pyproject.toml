[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oddsfox-graph"
version = "0.3.0"
description = "Build and discover structural logic graph artifacts from Polymarket data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Hypertrial"}]
dependencies = ["duckdb>=1.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/hypertrial/oddsfox-graph"
DataPipeline = "https://github.com/hypertrial/oddsfox-pipeline"

[project.optional-dependencies]
discovery = [
  "numpy>=1.26",
  "openai>=2",
  "pydantic>=2",
  "sentence-transformers>=5",
]
dev = ["numpy>=1.26", "openai>=2", "pydantic>=2", "pytest>=8"]

[project.scripts]
oddsfox-graph = "oddsfox_graph.cli:main"

[tool.setuptools.packages.find]
include = ["oddsfox_graph*"]

[tool.setuptools.package-data]
oddsfox_graph = ["taxonomies/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "full_output: checks that require existing output/wc2026 artifacts",
]
