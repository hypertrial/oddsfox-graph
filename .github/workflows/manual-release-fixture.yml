name: Manual v0.13 Release Fixture

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: Absolute path to the canonical catalog on the M4 runner
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-release-fixture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-fixture:
    runs-on: [self-hosted, macOS, ARM64, oddsfox-m4]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Bind the benchmark host, interpreter, and canonical input
        env:
          CANONICAL_INPUT: ${{ inputs.input_path }}
        run: |
          test -f "$CANONICAL_INPUT"
          python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version"
          python -c "from oddsfox_graph._discovery.performance_contracts import current_hardware; h=current_hardware(); assert (h.system, h.machine, h.processor) == ('Darwin', 'arm64', 'Apple M4'), h"
          python -c "import os; from pathlib import Path; from oddsfox_graph._discovery.provenance import sha256_file; from oddsfox_graph._discovery.versions import CANONICAL_CATALOG_SHA256; p=Path(os.environ['CANONICAL_INPUT']); observed=sha256_file(p); assert observed == CANONICAL_CATALOG_SHA256, (observed, CANONICAL_CATALOG_SHA256)"
      - name: Check fast-mode prerequisites
        env:
          CANONICAL_INPUT: ${{ inputs.input_path }}
        run: |
          python -m oddsfox_graph.cli doctor \
            --mode fast \
            --input "$CANONICAL_INPUT" \
            --input-profile polymarket-market-snapshot-v1 \
            --out output/fast \
            --output-format json
      - name: Produce three process-isolated benchmark runs
        env:
          CANONICAL_INPUT: ${{ inputs.input_path }}
        run: |
          python scripts/benchmark_discovery.py \
            --input "$CANONICAL_INPUT" \
            --output output/performance_report.json \
            --work-dir output/performance-runs \
            --performance-budget oddsfox_graph/benchmarks/m4-v0.13-fast-performance-budget.json \
            --require-gates
      - name: Assemble and validate the content-bound fixture
        env:
          CANONICAL_INPUT: ${{ inputs.input_path }}
        run: |
          python scripts/assemble_release_fixture.py \
            --input "$CANONICAL_INPUT" \
            --fast-baseline output/performance-runs/fast-run-3 \
            --performance-report output/performance_report.json \
            --destination output/discovery-release-fixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: discovery-release-fixture
          path: output/discovery-release-fixture
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
