name: Link check

on:
  schedule:
    # Weekly on Monday 06:00 UTC — never blocks PRs.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --no-progress
            README.md
            CONTRIBUTING.md
            CHANGELOG.md
            'docs/**/*.md'
          fail: true
