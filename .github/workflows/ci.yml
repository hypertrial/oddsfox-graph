name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy
      - name: Verify self-hosted-only inference surface
        run: |
          if rg -n -i 'openai|OPENAI_API_KEY|gpt-5' oddsfox_graph docs README.md pyproject.toml constraints-dev.txt scripts; then
            echo "Proprietary inference reference detected"
            exit 1
          fi
      - name: Verify current-only discovery surface
        run: |
          test ! -e oddsfox_graph/build.py
          test ! -e oddsfox_graph/review.py
          test ! -d oddsfox_graph/taxonomies
          if rg -ni 'review-export|review-score|benchmark-export|benchmark-compile|benchmark-summary|model-profile|ready_to_scale|pricing-file|pricing_file|review_queue|benchmark\.parquet|evaluation_report|source_format|input_granularity_seconds|wc2026|minutely|hourly|\.\[discovery\]' oddsfox_graph docs README.md pyproject.toml scripts; then
            echo "Removed compatibility surface detected"
            exit 1
          fi
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
      - run: python -m build
      - run: python -m pip install -c constraints-dev.txt --force-reinstall dist/*.whl
      - run: python -I -c "from oddsfox_graph.discovery import DiscoveryConfig"
      - run: python -I -c "from oddsfox_graph.graph import Graph"
      - run: python -I -m oddsfox_graph.cli --help
