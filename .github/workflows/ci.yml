name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --no-install-package llama-cpp-python
          # Install the locked version from the official CPU wheel index
          # (PyPI only publishes an sdist, which takes ~3 minutes to compile).
          LLAMA_VER=$(uv export --frozen --no-emit-project --no-annotate --no-hashes \
            | sed -n 's/^llama-cpp-python==\([^; ]*\).*/\1/p' | head -n 1)
          if [ -z "$LLAMA_VER" ]; then
            echo "Failed to resolve llama-cpp-python version from uv.lock" >&2
            exit 1
          fi
          uv pip install "llama-cpp-python==${LLAMA_VER}" \
            --index https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Run tests
        run: uv run pytest -q
