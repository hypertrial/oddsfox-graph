name: Manual v0.13 Release Validation

on:
  workflow_dispatch:
    inputs:
      fixture_run_id:
        description: Run containing the v0.13 fast release fixture
        required: true
        type: string
      input_sha256:
        description: Expected SHA-256 of fixture/input.parquet
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: manual-fast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manual-release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: discovery-release-fixture
          path: fixture
          github-token: ${{ github.token }}
          run-id: ${{ inputs.fixture_run_id }}
      - name: Verify required fast fixture
        env:
          EXPECTED_INPUT_SHA256: ${{ inputs.input_sha256 }}
        run: |
          test -f fixture/input.parquet
          test -d fixture/baselines/fast/state
          test -f fixture/baselines/fast/build_manifest.json
          test -f fixture/baselines/fast/viewer_manifest.json
          test -f fixture/baselines/fast/coverage_summary.json
          test -f fixture/expected_artifact_hashes.json
          test -f fixture/performance_report.json
          test -f fixture/release-fixture.json
          printf '%s  %s\n' "$EXPECTED_INPUT_SHA256" fixture/input.parquet | sha256sum --check -
      - run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy oddsfox_graph
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
      - run: python -m build
      - run: python scripts/check_wheel_size.py --wheel dist/oddsfox_graph-0.13.0-py3-none-any.whl
      - run: python -m pip install -c constraints-dev.txt --force-reinstall dist/*.whl
      - run: python -I -c "from oddsfox_graph.discovery import DiscoveryConfig"
      - run: python -I -m oddsfox_graph.cli --help
      - name: Validate content-bound deterministic release fixture
        run: |
          python -I -m oddsfox_graph.cli release-validate \
            --fixture-root fixture \
            --work-dir output/release-validation \
            --output-format json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: discovery-release-validation
          path: output/release-validation

  m4-fast-validation:
    needs: manual-release-validation
    runs-on: [self-hosted, macOS, ARM64, oddsfox-m4]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: discovery-release-fixture
          path: fixture
          github-token: ${{ github.token }}
          run-id: ${{ inputs.fixture_run_id }}
      - run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Bind the benchmark host and interpreter
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version"
          python -c "from oddsfox_graph._discovery.performance_contracts import current_hardware; h=current_hardware(); assert (h.system, h.machine, h.processor) == ('Darwin', 'arm64', 'Apple M4'), h"
      - name: Check fast-mode prerequisites
        run: |
          python -m oddsfox_graph.cli doctor \
            --mode fast \
            --input fixture/input.parquet \
            --input-profile polymarket-market-snapshot-v1 \
            --out output/fast \
            --output-format json
      - name: Enforce three process-isolated complete-catalog gates
        run: |
          python scripts/benchmark_discovery.py \
            --input fixture/input.parquet \
            --output output/performance_report.json \
            --work-dir output/performance-runs \
            --performance-budget oddsfox_graph/benchmarks/m4-v0.13-fast-performance-budget.json \
            --require-gates
      - name: Validate completed explorer and deterministic provenance
        run: |
          python -c "from pathlib import Path; from fastapi.testclient import TestClient; from oddsfox_graph._explorer.service import create_app; out=Path('output/performance-runs/fast-run-3'); c=TestClient(create_app(out)); m=c.get('/api/v1/meta'); assert m.status_code == 200; j=m.json(); assert j['viewer']['build_mode'] == 'fast'; assert j['viewer']['validation_status'] == 'DETERMINISTIC_VALIDATED'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m4-fast-validation
          path: output
