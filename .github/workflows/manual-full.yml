name: Manual Full Validation

on:
  workflow_dispatch:
    inputs:
      fixture_run_id:
        description: Run containing the discovery-release-fixture artifact
        required: true
        type: string
      vllm_fixture_run_id:
        description: Run containing vLLM-bound primary/verifier manifests
        required: true
        type: string
      input_sha256:
        description: Expected SHA-256 of fixture/input.parquet
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: manual-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: discovery-release-fixture
          path: fixture
          github-token: ${{ github.token }}
          run-id: ${{ inputs.fixture_run_id }}
      - name: Verify required fixture
        env:
          EXPECTED_INPUT_SHA256: ${{ inputs.input_sha256 }}
        run: |
          test -f fixture/input.parquet
          test -d fixture/cache
          test -d fixture/baselines/5000/state
          test -d fixture/baselines/20000/state
          test -d fixture/baselines/all/state
          test -f fixture/baselines/all/viewer_manifest.json
          test -f fixture/baselines/all/coverage_summary.json
          test -f fixture/expected_artifact_hashes.json
          test -f fixture/qualification_cases.parquet
          test -f fixture/qualification_report.json
          test -f fixture/automation_profile.json
          test -f fixture/performance_report.json
          test -f fixture/compute_profile.json
          test -f fixture/primary_model_manifest.json
          test -f fixture/verifier_model_manifest.json
          test -f fixture/release-fixture.json
          printf '%s  %s\n' "$EXPECTED_INPUT_SHA256" fixture/input.parquet | sha256sum --check -
      - run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
      - run: python -m build
      - run: python -m pip install -c constraints-dev.txt --force-reinstall dist/*.whl
      - run: python -I -c "from oddsfox_graph.discovery import DiscoveryConfig"
      - run: python -I -m oddsfox_graph.cli --help
      - name: Validate content-bound automated release fixture
        run: |
          python -I -m oddsfox_graph.cli release-validate \
            --fixture-root fixture \
            --work-dir output/release-validation \
            --output-format json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: discovery-release-validation
          path: output/release-validation

  m4-live-validation:
    needs: release-validation
    runs-on: [self-hosted, macOS, ARM64, oddsfox-m4]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: discovery-release-fixture
          path: fixture
          github-token: ${{ github.token }}
          run-id: ${{ inputs.fixture_run_id }}
      - run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Check both llama.cpp runtimes
        run: |
          python -m oddsfox_graph.cli model-check --model-manifest fixture/primary_model_manifest.json --llm-base-url http://127.0.0.1:8080/v1 --output-format json
          python -m oddsfox_graph.cli model-check --model-manifest fixture/verifier_model_manifest.json --llm-base-url http://127.0.0.1:8081/v1 --output-format json
      - name: Run real qualification and equivalent discovery modes
        run: |
          python -m oddsfox_graph.cli qualify --input fixture/input.parquet --out output/qualification --cache-dir output/live-cache --primary-model-manifest fixture/primary_model_manifest.json --verifier-model-manifest fixture/verifier_model_manifest.json --compute-profile fixture/compute_profile.json --output-format json
          python -m oddsfox_graph.cli discover --input fixture/input.parquet --out output/5000 --cache-dir output/live-cache --primary-model-manifest fixture/primary_model_manifest.json --verifier-model-manifest fixture/verifier_model_manifest.json --compute-profile fixture/compute_profile.json --max-propositions 5000 --progress-format json --output-format json
          cp output/5000/build_manifest.json output/5000-online-manifest.json
          python -m oddsfox_graph.cli discover --input fixture/input.parquet --out output/5000 --cache-dir output/live-cache --primary-model-manifest fixture/primary_model_manifest.json --verifier-model-manifest fixture/verifier_model_manifest.json --compute-profile fixture/compute_profile.json --max-propositions 5000 --offline --progress-format json --output-format json
          python -c "import json; from pathlib import Path; a=json.loads(Path('output/5000-online-manifest.json').read_text())['artifact_hashes']; b=json.loads(Path('output/5000/build_manifest.json').read_text())['artifact_hashes']; assert a == b"
          python -m oddsfox_graph.cli discover --input fixture/input.parquet --out output/5000-incremental --cache-dir output/live-cache --primary-model-manifest fixture/primary_model_manifest.json --verifier-model-manifest fixture/verifier_model_manifest.json --compute-profile fixture/compute_profile.json --max-propositions 5000 --incremental-from output/5000 --offline --progress-format json --output-format json
          python -c "import json; from pathlib import Path; a=json.loads(Path('output/5000/build_manifest.json').read_text())['artifact_hashes']; b=json.loads(Path('output/5000-incremental/build_manifest.json').read_text())['artifact_hashes']; assert a == b"
          python -m oddsfox_graph.cli discover --input fixture/input.parquet --out output/20000 --cache-dir output/live-cache --primary-model-manifest fixture/primary_model_manifest.json --verifier-model-manifest fixture/verifier_model_manifest.json --compute-profile fixture/compute_profile.json --max-propositions 20000 --progress-format json --output-format json
          cp output/20000/build_manifest.json output/20000-online-manifest.json
          python -m oddsfox_graph.cli discover --input fixture/input.parquet --out output/20000 --cache-dir output/live-cache --primary-model-manifest fixture/primary_model_manifest.json --verifier-model-manifest fixture/verifier_model_manifest.json --compute-profile fixture/compute_profile.json --max-propositions 20000 --offline --progress-format json --output-format json
          python -c "import json; from pathlib import Path; a=json.loads(Path('output/20000-online-manifest.json').read_text())['artifact_hashes']; b=json.loads(Path('output/20000/build_manifest.json').read_text())['artifact_hashes']; assert a == b"
          python -m oddsfox_graph.cli discover --input fixture/input.parquet --out output/20000-incremental --cache-dir output/live-cache --primary-model-manifest fixture/primary_model_manifest.json --verifier-model-manifest fixture/verifier_model_manifest.json --compute-profile fixture/compute_profile.json --max-propositions 20000 --incremental-from output/20000 --offline --progress-format json --output-format json
          python -c "import json; from pathlib import Path; a=json.loads(Path('output/20000/build_manifest.json').read_text())['artifact_hashes']; b=json.loads(Path('output/20000-incremental/build_manifest.json').read_text())['artifact_hashes']; assert a == b"
          python -m oddsfox_graph.cli discover --input fixture/input.parquet --out output/all --cache-dir output/live-cache --primary-model-manifest fixture/primary_model_manifest.json --verifier-model-manifest fixture/verifier_model_manifest.json --compute-profile fixture/compute_profile.json --all-propositions --progress-format json --output-format json
          cp output/all/build_manifest.json output/all-online-manifest.json
          python -m oddsfox_graph.cli discover --input fixture/input.parquet --out output/all --cache-dir output/live-cache --primary-model-manifest fixture/primary_model_manifest.json --verifier-model-manifest fixture/verifier_model_manifest.json --compute-profile fixture/compute_profile.json --all-propositions --offline --progress-format json --output-format json
          python -c "import json; from pathlib import Path; a=json.loads(Path('output/all-online-manifest.json').read_text())['artifact_hashes']; b=json.loads(Path('output/all/build_manifest.json').read_text())['artifact_hashes']; c=json.loads(Path('output/all/coverage_summary.json').read_text()); assert a == b; assert c['all_market_selection'] is True; assert c['markets'] == 94777; assert c['propositions'] == 189570; assert c['input_selection']['input_market_rows'] == 94781; assert c['input_selection']['invalid_market_rows'] == 4"
          python -m oddsfox_graph.cli discover --input fixture/input.parquet --out output/all-incremental --cache-dir output/live-cache --primary-model-manifest fixture/primary_model_manifest.json --verifier-model-manifest fixture/verifier_model_manifest.json --compute-profile fixture/compute_profile.json --all-propositions --incremental-from output/all --offline --progress-format json --output-format json
          python -c "import json; from pathlib import Path; a=json.loads(Path('output/all/build_manifest.json').read_text())['artifact_hashes']; b=json.loads(Path('output/all-incremental/build_manifest.json').read_text())['artifact_hashes']; assert a == b"
      - name: Validate all-market explorer API and static export
        run: |
          python -c "from pathlib import Path; from fastapi.testclient import TestClient; from oddsfox_graph._explorer.service import create_app; c=TestClient(create_app(Path('output/all'))); assert c.get('/api/v1/meta').status_code == 200; assert c.get('/api/v1/overview?level=event&max_nodes=100&max_edges=200').status_code == 200"
          python -c "from pathlib import Path; from oddsfox_graph.graph import Graph; from oddsfox_graph.explorer import export_explorer; g=Graph.open('output/all'); event=str(g.events(limit=1).rows[0]['event_key']); export_explorer(Path('output/all'), Path('output/static-explorer'), scope='event', identifier=event, max_nodes=5000, max_edges=10000)"
      - name: Enforce process-isolated M4 performance gates
        run: |
          python scripts/benchmark_discovery.py --input fixture/input.parquet --output output/performance_report.json --sizes 5000,20000 --modes clean,offline,one-market-incremental --repetitions 3 --performance-budget benchmarks/m4-v0.10-performance-budget.json --require-gates
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m4-live-validation
          path: output

  vllm-live-validation:
    needs: release-validation
    runs-on: [self-hosted, Linux, X64, gpu, oddsfox-vllm]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: discovery-release-fixture
          path: fixture
          github-token: ${{ github.token }}
          run-id: ${{ inputs.fixture_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: discovery-vllm-fixture
          path: vllm
          github-token: ${{ github.token }}
          run-id: ${{ inputs.vllm_fixture_run_id }}
      - run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Check both vLLM runtimes and qualify
        run: |
          python -m oddsfox_graph.cli model-check --model-manifest vllm/primary_model_manifest.json --llm-base-url http://127.0.0.1:8080/v1 --output-format json
          python -m oddsfox_graph.cli model-check --model-manifest vllm/verifier_model_manifest.json --llm-base-url http://127.0.0.1:8081/v1 --output-format json
          python -m oddsfox_graph.cli qualify --input fixture/input.parquet --out output/vllm-qualification --cache-dir output/vllm-cache --primary-model-manifest vllm/primary_model_manifest.json --verifier-model-manifest vllm/verifier_model_manifest.json --compute-profile vllm/compute_profile.json --output-format json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vllm-live-validation
          path: output
