name: Manual Full Validation

on:
  workflow_dispatch:
    inputs:
      fixture_run_id:
        description: Run containing the discovery-release-fixture artifact
        required: true
        type: string
      input_sha256:
        description: Expected SHA-256 of fixture/input.parquet
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: manual-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: discovery-release-fixture
          path: fixture
          github-token: ${{ github.token }}
          run-id: ${{ inputs.fixture_run_id }}
      - name: Verify required fixture
        env:
          EXPECTED_INPUT_SHA256: ${{ inputs.input_sha256 }}
        run: |
          test -f fixture/input.parquet
          test -d fixture/cache
          test -f fixture/expected-artifact-hashes.json
          test -f fixture/labels.csv
          printf '%s  %s\n' "$EXPECTED_INPUT_SHA256" fixture/input.parquet | sha256sum --check -
      - run: python -m pip install -e ".[dev,discovery]"
      - run: python -m ruff check .
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -I -c "from oddsfox_graph.discovery import DiscoveryConfig"
      - run: python -I -m oddsfox_graph.cli --help
      - name: Validate real-data offline replay and review thresholds
        run: |
          python -I scripts/validate_discovery_release.py \
            --input fixture/input.parquet \
            --cache-dir fixture/cache \
            --work-dir output/release-validation \
            --expected-hashes fixture/expected-artifact-hashes.json \
            --labels fixture/labels.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: discovery-release-validation
          path: output/release-validation
